<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101a44">
    <meta name="robots" content="noindex">
    <title>Your sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Playwrite+SK:wght@100..400&display=swap">
    <link rel="stylesheet" href="day.css">
    <style>
      /* Layout: the sky is the whole screen, down to two people on a hill; the words sit over the hill. */
      :root { --bg: #101a44; --ink: #fdeccf; color-scheme: dark; }
      .scene { position: fixed; inset: 0; cursor: crosshair; }
      .foot { margin-top: auto; pointer-events: none; }
      .foot .btn { pointer-events: auto; background: #121229cc; }
      .foot .btn:hover { background: var(--ink); color: var(--bg); }
      .words {
        position: fixed; left: 0; right: 0; top: max(22px, env(safe-area-inset-top, 0px));
        margin: 0; padding: 0 16px; text-align: center; pointer-events: none;
        font-family: var(--hand); font-weight: 300; font-size: clamp(23px, 5.4vw, 50px); line-height: 1.6; text-wrap: balance;
        text-shadow: 0 0 22px #ffcf8a88; opacity: 0; transition: opacity 1.4s ease;
      }
      .words.is-on { opacity: 1; }
    </style>
    <script src="content.js" defer></script>
    <script src="day.js" defer></script>
    <script src="page.js" defer></script>
  </head>
  <body>
    <h1 class="sr-only">A sky for <span data-name>Any</span></h1>
    <div class="scene"><canvas id="sky" aria-hidden="true"></canvas></div>
    <p class="words" id="words" aria-hidden="true"></p>
    <div class="foot">
      <p class="hint" id="hint"></p>
      <div class="row" id="row">
        <button class="btn" type="button" id="next-star">Next star</button>
        <button class="btn" type="button" id="wish">Shooting star</button>
      </div>
    </div>
    <p class="sr-only" id="live" role="status"></p>
  </body>
</html>
